name: Status Timeline CI

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Uptime CI, Static Site CI]
    types: [completed]
  push:
    branches: [master]
    paths:
      - history/**
      - scripts/generate-status-timeline.mjs
      - scripts/fixtures/status-timeline.fixture.json
      - .github/workflows/status-timeline.yml

permissions:
  contents: write

concurrency:
  group: nodeclaw-status-api-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-status-timeline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate status timeline JSON
        run: node scripts/generate-status-timeline.mjs

      - name: Commit status timeline JSON to master
        if: github.event_name != 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/status-timeline
          if git diff --cached --quiet; then
            echo "status_timeline_master_changed=false"
          else
            git commit -m ":card_file_box: Update status timeline [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
            echo "status_timeline_master_changed=true"
          fi

      - name: Publish status timeline JSON to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: api/status-timeline
          destination_dir: api/status-timeline
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
