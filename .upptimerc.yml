  customBodyHtml: |
    <section id="nodeclaw-status-timeline" class="nodeclaw-status-timeline" aria-label="NodeClaw status timeline" hidden></section>
    <section id="nodeclaw-status-events" class="nodeclaw-status-events" aria-label="NodeClaw status events" hidden></section>
    <script>
      (function () {
        var PAGE_SIZE = 5;
        var sectionConfig = [
          { type: 'announcement', title: 'Announcements' },
          { type: 'notice', title: 'Notices' },
          { type: 'maintenance', title: 'Maintenance' },
          { type: 'operational-report', title: 'Reports' },
          { type: 'incident', title: 'Manual Incidents' }
        ];

        function onReady(callback) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', callback);
          } else {
            callback();
          }
        }

        function textNode(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }

        function statusBaseUrl() {
          var base = document.querySelector('base');
          var href = base && base.getAttribute('href') ? base.getAttribute('href') : '/Nodeclaw-Status/';
          return href.endsWith('/') ? href : href + '/';
        }

        function formatDate(value) {
          if (!value) return '';
          var date = new Date(value);
          if (Number.isNaN(date.getTime())) return '';
          return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(date);
        }

        function formatDateRange(start, end) {
          var startText = formatDate(start);
          var endText = formatDate(end);
          if (startText && endText) return startText + ' – ' + endText;
          return startText || endText || '';
        }

        function renderBadge(text, modifier) {
          return textNode('span', 'nodeclaw-status-events__badge' + (modifier ? ' nodeclaw-status-events__badge--' + modifier : ''), text);
        }

        function renderEvent(event) {
          var item = textNode('article', 'nodeclaw-status-events__item');
          var topline = textNode('div', 'nodeclaw-status-events__topline');
          var title = textNode('div', 'nodeclaw-status-events__title', event.title || 'Status event');
          var badges = textNode('div', 'nodeclaw-status-events__badges');

          badges.appendChild(renderBadge(event.state || 'active'));
          badges.appendChild(renderBadge(event.severity || 'info', event.severity || 'info'));
          if (event.pinned) badges.appendChild(renderBadge('pinned'));

          topline.appendChild(title);
          topline.appendChild(badges);
          item.appendChild(topline);
          item.appendChild(textNode('p', 'nodeclaw-status-events__summary', event.summary || 'No public summary provided.'));

          var meta = textNode('div', 'nodeclaw-status-events__meta');
          var startsAt = formatDate(event.startsAt || event.scheduledFor || event.publishedAt);
          if (startsAt) meta.appendChild(textNode('span', '', startsAt));
          if (Array.isArray(event.components) && event.components.length) {
            meta.appendChild(textNode('span', '', event.components.join(', ')));
          }
          if (event.sourceIssue) {
            var link = textNode('a', 'nodeclaw-status-events__link', 'Issue #' + (event.issueNumber || event.id));
            link.href = event.sourceIssue;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            meta.appendChild(link);
          }
          item.appendChild(meta);
          return item;
        }

        function sectionTitle(type) {
          var match = sectionConfig.find(function (section) { return section.type === type; });
          return match ? match.title : 'Status Updates';
        }

        function eventTimestamp(event) {
          var value = event.startsAt || event.scheduledFor || event.publishedAt || event.updatedAt;
          var date = value ? new Date(value) : null;
          return date && !Number.isNaN(date.getTime()) ? date.getTime() : 0;
        }

        function sortEvents(events) {
          return events.slice().sort(function (left, right) {
            if (Boolean(left.pinned) !== Boolean(right.pinned)) return left.pinned ? -1 : 1;
            return eventTimestamp(right) - eventTimestamp(left);
          });
        }

        function formatPercent(value) {
          if (typeof value !== 'number' || !Number.isFinite(value)) return 'No samples';
          return (Math.round(value * 100) / 100).toString() + '%';
        }

        function formatSeconds(value) {
          if (!value || !Number.isFinite(value)) return 'observed window';
          if (value < 60) return value + 's observed window';
          var minutes = Math.round(value / 60);
          return minutes + 'm observed window';
        }

        function timelineUrl(path) {
          if (!path) return '';
          if (/^https?:\/\//.test(path) || path.charAt(0) === '/') return path;
          return statusBaseUrl() + path;
        }

        function renderTimelineSegments(segments) {
          var bar = textNode('div', 'nodeclaw-status-timeline__segments');
          if (!Array.isArray(segments) || !segments.length) {
            bar.appendChild(textNode('div', 'nodeclaw-status-timeline__empty', 'No samples in this window.'));
            return bar;
          }
          segments.forEach(function (segment) {
            var allowedStates = ['up', 'down', 'degraded', 'unknown'];
            var state = allowedStates.indexOf(segment.state) === -1 ? 'unknown' : segment.state;
            var node = textNode('span', 'nodeclaw-status-timeline__segment nodeclaw-status-timeline__segment--' + state);
            var statusCodes = Array.isArray(segment.statusCodes) && segment.statusCodes.length
              ? segment.statusCodes
              : (segment.statusCode !== null && segment.statusCode !== undefined ? [segment.statusCode] : []);
            var codeText = statusCodes.length ? ' HTTP ' + statusCodes.join(', ') : '';
            var sampleText = typeof segment.sampleCount === 'number'
              ? ' · ' + segment.sampleCount + (segment.sampleCount === 1 ? ' sample' : ' samples')
              : '';
            var rangeText = formatDateRange(segment.startsAt, segment.endsAt);
            node.title = state + codeText + sampleText + (rangeText ? ' · ' + rangeText : '');
            node.setAttribute('aria-label', node.title);
            bar.appendChild(node);
          });
          return bar;
        }

        function renderTimelineIncidents(incidents) {
          var list = textNode('div', 'nodeclaw-status-timeline__incidents');
          if (!Array.isArray(incidents) || !incidents.length) return list;
          incidents.slice(0, 3).forEach(function (incident) {
            var text = (incident.summary || 'Incident samples observed.') + ' ' + formatSeconds(incident.observedDurationSeconds);
            list.appendChild(textNode('div', 'nodeclaw-status-timeline__incident', text));
          });
          return list;
        }

        function renderTimelineRow(component, isDaily) {
          var row = textNode('article', 'nodeclaw-status-timeline__row');
          var head = textNode('div', 'nodeclaw-status-timeline__row-head');
          var identity = textNode('div', '');
          var uptime = component.uptime || {};
          var percent = isDaily || typeof uptime.upptimeUptimePercent !== 'number'
            ? uptime.observedUptimePercent
            : uptime.upptimeUptimePercent;
          var label = isDaily || typeof uptime.upptimeUptimePercent !== 'number' ? 'observed uptime' : '24h uptime';
          var metric = textNode('div', 'nodeclaw-status-timeline__uptime', formatPercent(percent));
          var sampleText = 'Samples ' + (uptime.sampleCount || 0)
            + ' · down ' + (uptime.downSampleCount || 0)
            + ' · degraded ' + (uptime.degradedSampleCount || 0)
            + ' · incidents ' + (uptime.incidentCount || 0);

          identity.appendChild(textNode('div', 'nodeclaw-status-timeline__name', component.name || component.slug || 'Component'));
          if (component.publicUrl) identity.appendChild(textNode('div', 'nodeclaw-status-timeline__url', component.publicUrl));
          metric.appendChild(textNode('span', 'nodeclaw-status-timeline__uptime-label', label));
          head.appendChild(identity);
          head.appendChild(metric);
          row.appendChild(head);
          row.appendChild(renderTimelineSegments(component.segments));
          row.appendChild(textNode('p', 'nodeclaw-status-timeline__meta', sampleText));
          row.appendChild(renderTimelineIncidents(component.incidents));
          return row;
        }

        function renderTimeline(root, indexData, dayData, selectedDay) {
          var components = Array.isArray(dayData && dayData.components) ? dayData.components : (Array.isArray(indexData && indexData.components) ? indexData.components : []);
          if (!components.length) return;

          var isDaily = Boolean(dayData);
          var board = textNode('section', 'nodeclaw-status-timeline__board');
          var head = textNode('div', 'nodeclaw-status-timeline__head');
          var toolbar = textNode('div', 'nodeclaw-status-timeline__toolbar');
          var select = textNode('select', 'nodeclaw-status-timeline__select');
          var list = textNode('div', 'nodeclaw-status-timeline__list');
          var days = Array.isArray(indexData.availableDays) ? indexData.availableDays : [];
          var windowLabel = isDaily ? selectedDay : 'latest 24 hours';

          head.appendChild(textNode('h2', 'nodeclaw-status-timeline__heading', 'Uptime Timeline'));
          head.appendChild(textNode('p', 'nodeclaw-status-timeline__description', 'Uptime %, recent check samples, and observed incident windows compiled from Upptime/Git history.'));

          select.appendChild(textNode('option', '', 'Latest 24 hours'));
          select.firstChild.value = '24h';
          days.forEach(function (day) {
            var option = textNode('option', '', day.date);
            option.value = day.date;
            select.appendChild(option);
          });
          select.value = selectedDay || '24h';
          select.setAttribute('aria-label', 'Select status timeline day');
          select.addEventListener('change', function () {
            if (select.value === '24h') {
              renderTimeline(root, indexData, null, null);
              return;
            }
            var selected = days.find(function (day) { return day.date === select.value; });
            if (!selected) return;
            fetch(timelineUrl(selected.path), { cache: 'no-store' })
              .then(function (response) { return response.ok ? response.json() : null; })
              .then(function (data) { if (data) renderTimeline(root, indexData, data, selected.date); });
          });

          toolbar.appendChild(textNode('div', 'nodeclaw-status-timeline__meta', windowLabel));
          if (days.length) toolbar.appendChild(select);
          components.forEach(function (component) { list.appendChild(renderTimelineRow(component, isDaily)); });
          board.appendChild(head);
          board.appendChild(toolbar);
          board.appendChild(list);
          root.replaceChildren(board);
          root.hidden = false;

          var header = document.querySelector('main > header');
          if (header) header.insertAdjacentElement('afterend', root);
        }

        function render(root, data) {
          var events = Array.isArray(data && data.events) ? data.events : [];
          var visibleEvents = sortEvents(events.filter(function (event) {
            return event && ['scheduled', 'active', 'resolved'].indexOf(event.state) !== -1;
          }));
          if (!visibleEvents.length) return;

          var selectedType = 'all';
          var currentPage = 1;
          var board = textNode('section', 'nodeclaw-status-events__board');
          var head = textNode('div', 'nodeclaw-status-events__board-head');
          var toolbar = textNode('div', 'nodeclaw-status-events__toolbar');
          var tabs = textNode('div', 'nodeclaw-status-events__tabs');
          var count = textNode('div', 'nodeclaw-status-events__count');
          var list = textNode('div', 'nodeclaw-status-events__list');
          var pager = textNode('div', 'nodeclaw-status-events__pager');
          var previous = textNode('button', 'nodeclaw-status-events__pager-button', 'Previous');
          var pageLabel = textNode('span', 'nodeclaw-status-events__page-label');
          var next = textNode('button', 'nodeclaw-status-events__pager-button', 'Next');
          var tabButtons = [];
          var typeCounts = visibleEvents.reduce(function (accumulator, event) {
            accumulator[event.type] = (accumulator[event.type] || 0) + 1;
            return accumulator;
          }, {});
          var tabConfig = [{ type: 'all', title: 'All' }].concat(sectionConfig);

          head.appendChild(textNode('h2', 'nodeclaw-status-events__heading', 'Status Updates'));
          head.appendChild(textNode('p', 'nodeclaw-status-events__description', 'Public announcements, notices, maintenance, reports, and manual incident updates.'));

          tabConfig.forEach(function (section) {
            var total = section.type === 'all' ? visibleEvents.length : (typeCounts[section.type] || 0);
            var button = textNode('button', 'nodeclaw-status-events__tab', section.title + ' ' + total);
            button.type = 'button';
            button.disabled = section.type !== 'all' && total === 0;
            button.setAttribute('aria-pressed', section.type === selectedType ? 'true' : 'false');
            button.addEventListener('click', function () {
              if (button.disabled) return;
              selectedType = section.type;
              currentPage = 1;
              updateBoard();
            });
            tabs.appendChild(button);
            tabButtons.push({ type: section.type, button: button });
          });

          previous.type = 'button';
          next.type = 'button';
          previous.addEventListener('click', function () {
            if (currentPage > 1) {
              currentPage -= 1;
              updateBoard();
            }
          });
          next.addEventListener('click', function () {
            currentPage += 1;
            updateBoard();
          });
          pager.appendChild(previous);
          pager.appendChild(pageLabel);
          pager.appendChild(next);
          toolbar.appendChild(tabs);
          toolbar.appendChild(count);
          board.appendChild(head);
          board.appendChild(toolbar);
          board.appendChild(list);
          board.appendChild(pager);

          function currentItems() {
            if (selectedType === 'all') return visibleEvents;
            return visibleEvents.filter(function (event) { return event.type === selectedType; });
          }

          function updateBoard() {
            var items = currentItems();
            var pageCount = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
            currentPage = Math.min(Math.max(currentPage, 1), pageCount);
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageItems = items.slice(start, start + PAGE_SIZE);
            list.replaceChildren();
            pageItems.forEach(function (event) { list.appendChild(renderEvent(event)); });
            tabButtons.forEach(function (entry) {
              entry.button.setAttribute('aria-pressed', entry.type === selectedType ? 'true' : 'false');
            });
            count.textContent = 'Showing ' + (start + 1) + '-' + (start + pageItems.length) + ' of ' + items.length + ' ' + sectionTitle(selectedType).toLowerCase();
            pageLabel.textContent = 'Page ' + currentPage + ' / ' + pageCount;
            previous.disabled = currentPage <= 1;
            next.disabled = currentPage >= pageCount;
            pager.hidden = pageCount <= 1;
          }

          updateBoard();
          root.replaceChildren(board);
          root.hidden = false;

          var header = document.querySelector('main > header');
          var timelineRoot = document.getElementById('nodeclaw-status-timeline');
          var anchor = timelineRoot && timelineRoot.parentElement === (header && header.parentElement) ? timelineRoot : header;
          if (anchor) anchor.insertAdjacentElement('afterend', root);
        }

        onReady(function () {
          var timelineRoot = document.getElementById('nodeclaw-status-timeline');
          if (timelineRoot) {
            fetch(statusBaseUrl() + 'api/status-timeline/index.json', { cache: 'no-store' })
              .then(function (response) { return response.ok ? response.json() : null; })
              .then(function (data) { if (data) renderTimeline(timelineRoot, data, null, null); })
              .catch(function () { timelineRoot.hidden = true; });
          }

          var root = document.getElementById('nodeclaw-status-events');
          if (!root) return;
          fetch(statusBaseUrl() + 'api/status-events.json', { cache: 'no-store' })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (data) { if (data) render(root, data); })
            .catch(function () { root.hidden = true; });
        });
      }());
    </script>
