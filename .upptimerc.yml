owner: DarKWinGTM
repo: Nodeclaw-Status

sites:
  - name: NodeNetwork Website — nodenetwork.ovh
    url: https://nodenetwork.ovh

  - name: NodeClaw App Health — app.nodenetwork.ovh/health
    url: https://app.nodenetwork.ovh/health

  - name: NodeClaw Runtime Health — runtime.nodenetwork.ovh/health
    url: https://runtime.nodenetwork.ovh/health

status-website:
  baseUrl: /Nodeclaw-Status
  name: NodeClaw Status
  introTitle: "NodeClaw System Status"
  introMessage: NodeClaw public status monitoring is active. This page tracks NodeNetwork Website and NodeClaw App Health availability.
  customHeadHtml: |
    <style>
      :root {
        --nodeclaw-page-bg: #020617;
        --nodeclaw-page-bg-soft: #0f172a;
        --nodeclaw-page-surface: rgba(15, 23, 42, 0.82);
        --nodeclaw-page-surface-strong: rgba(15, 23, 42, 0.94);
        --nodeclaw-page-surface-soft: rgba(30, 41, 59, 0.70);
        --nodeclaw-page-border: rgba(148, 163, 184, 0.18);
        --nodeclaw-page-border-blue: rgba(96, 165, 250, 0.34);
        --nodeclaw-page-text: #f8fafc;
        --nodeclaw-page-muted: #cbd5e1;
        --nodeclaw-page-subtle: #94a3b8;
        --nodeclaw-page-link: #93c5fd;
        --nodeclaw-page-link-strong: #bfdbfe;
        --nodeclaw-page-accent: #3b82f6;
        --nodeclaw-page-accent-soft: rgba(37, 99, 235, 0.22);
        --nodeclaw-page-health: #6ee7b7;
        --nodeclaw-page-health-soft: rgba(16, 185, 129, 0.18);
        --nodeclaw-page-warning: #fcd34d;
        --nodeclaw-page-danger: #fca5a5;
      }
      html {
        background: var(--nodeclaw-page-bg);
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(circle at 8% 0%, rgba(37, 99, 235, 0.38), transparent 30rem),
          radial-gradient(circle at 92% 4%, rgba(110, 231, 183, 0.16), transparent 28rem),
          linear-gradient(180deg, #020617 0%, #0f172a 42%, #111827 100%) !important;
        color: var(--nodeclaw-page-text) !important;
        min-height: 100%;
      }
      body::before {
        background:
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        content: '';
        inset: 0;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.72), transparent 72%);
        pointer-events: none;
        position: fixed;
        z-index: -1;
      }
      #sapper,
      main,
      main.container {
        background: transparent !important;
        color: var(--nodeclaw-page-text) !important;
      }
      main.container {
        max-width: 1120px;
        padding-bottom: 3rem;
      }
      nav,
      nav.svelte-a08hsz {
        backdrop-filter: blur(18px);
        background: rgba(2, 6, 23, 0.86) !important;
        border-bottom: 1px solid var(--nodeclaw-page-border-blue) !important;
        box-shadow: 0 16px 42px rgba(2, 6, 23, 0.36);
      }
      nav a,
      nav .container a,
      main.container a {
        color: var(--nodeclaw-page-link) !important;
        font-weight: 700;
      }
      nav a:hover,
      main.container a:hover {
        color: var(--nodeclaw-page-link-strong) !important;
      }
      main.container > header,
      header.svelte-ngkazm {
        background:
          radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.24), transparent 28rem),
          linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.76));
        border: 1px solid var(--nodeclaw-page-border-blue);
        border-radius: 26px;
        box-shadow: 0 26px 70px rgba(2, 6, 23, 0.38);
        margin: 1.5rem 0 1.1rem;
        padding: 1.35rem !important;
      }
      header h1,
      main.container h1,
      main.container h2,
      main.container h3 {
        color: var(--nodeclaw-page-text) !important;
        letter-spacing: -0.025em;
      }
      header p,
      main.container p,
      main.container small,
      main.container time,
      main.container .data {
        color: var(--nodeclaw-page-muted) !important;
      }
      article.up:not(.link) {
        background:
          linear-gradient(135deg, rgba(16, 185, 129, 0.20), rgba(37, 99, 235, 0.18)),
          rgba(15, 23, 42, 0.90) !important;
        border: 1px solid rgba(110, 231, 183, 0.42) !important;
        border-radius: 18px !important;
        box-shadow: 0 20px 54px rgba(2, 6, 23, 0.34);
        color: #dcfce7 !important;
        font-weight: 800;
      }
      article.down:not(.link),
      article.degraded:not(.link) {
        background: rgba(127, 29, 29, 0.30) !important;
        border: 1px solid rgba(252, 165, 165, 0.44) !important;
        color: #fee2e2 !important;
      }
      article.link,
      article.graph,
      article.up.link.graph,
      main.container > div.f,
      div.f.svelte-fqsq6s {
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 18rem),
          linear-gradient(135deg, rgba(15, 23, 42, 0.90), rgba(30, 41, 59, 0.72)) !important;
        border: 1px solid var(--nodeclaw-page-border) !important;
        border-radius: 20px !important;
        box-shadow: 0 18px 48px rgba(2, 6, 23, 0.30);
        color: var(--nodeclaw-page-text) !important;
      }
      article.link:hover,
      article.graph:hover {
        border-color: var(--nodeclaw-page-border-blue) !important;
        box-shadow: 0 22px 58px rgba(37, 99, 235, 0.18);
      }
      article.link h2,
      article.link h3,
      article.graph h2,
      article.graph h3 {
        color: var(--nodeclaw-page-text) !important;
      }
      main.container > div.f.svelte-fqsq6s {
        align-items: center;
        display: flex !important;
        flex-wrap: wrap;
        gap: 0.72rem;
        justify-content: space-between;
        margin: 1.15rem 0 0.85rem;
        padding: 0.72rem 0.84rem 0.72rem 1rem !important;
      }
      main.container > div.f.svelte-fqsq6s > h2 {
        color: var(--nodeclaw-page-text) !important;
        font-size: 1.08rem;
        font-weight: 820;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin: 0 !important;
      }
      section.live-status.svelte-fqsq6s {
        margin-top: 0 !important;
      }
      article.link p,
      article.graph p,
      article.link small,
      article.graph small {
        color: var(--nodeclaw-page-muted) !important;
      }
      form.f.r.svelte-fqsq6s {
        align-items: center;
        background: rgba(2, 6, 23, 0.34) !important;
        border: 1px solid rgba(147, 197, 253, 0.18) !important;
        border-radius: 999px !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 10px 24px rgba(2, 6, 23, 0.22) !important;
        display: flex !important;
        gap: 0.14rem;
        padding: 0.18rem !important;
      }
      form.f.r.svelte-fqsq6s > div {
        display: flex;
      }
      form.f.r.svelte-fqsq6s input[type='radio'] {
        opacity: 0;
        pointer-events: none;
        position: absolute;
      }
      form.f.r.svelte-fqsq6s input[type='radio'] + label {
        align-items: center;
        background: transparent !important;
        border: 0 !important;
        border-radius: 999px !important;
        box-shadow: none !important;
        color: var(--nodeclaw-page-muted) !important;
        cursor: pointer;
        display: inline-flex;
        font-size: 0.86rem;
        font-weight: 750;
        justify-content: center;
        line-height: 1;
        min-height: 1.55rem;
        min-width: 2.05rem;
        padding: 0.16rem 0.56rem !important;
        transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }
      form.f.r.svelte-fqsq6s input[type='radio'] + label:hover {
        background: rgba(147, 197, 253, 0.10) !important;
        color: #e0f2fe !important;
      }
      form.f.r.svelte-fqsq6s input[type='radio']:checked + label {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.86), rgba(96, 165, 250, 0.58)) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 8px 18px rgba(37, 99, 235, 0.30) !important;
        color: #ffffff !important;
        transform: translateY(-1px);
      }
      input[type='checkbox'] + label {
        color: var(--nodeclaw-page-muted) !important;
      }
      input[type='checkbox']:checked + label {
        color: #ffffff !important;
      }
      button,
      input,
      select,
      textarea {
        border-color: var(--nodeclaw-page-border) !important;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      label:focus-visible {
        border-radius: 8px;
        outline: 3px solid rgba(147, 197, 253, 0.40) !important;
        outline-offset: 3px;
      }
      footer,
      footer.svelte-a08hsz {
        background: transparent !important;
        color: var(--nodeclaw-page-subtle) !important;
      }
      .nodeclaw-status-events {
        --nodeclaw-accent: #60a5fa;
        --nodeclaw-accent-strong: #bfdbfe;
        --nodeclaw-accent-soft: rgba(37, 99, 235, 0.22);
        --nodeclaw-surface: rgba(15, 23, 42, 0.88);
        --nodeclaw-surface-soft: rgba(30, 41, 59, 0.70);
        --nodeclaw-text: #f8fafc;
        --nodeclaw-muted: #cbd5e1;
        --nodeclaw-subtle: #94a3b8;
        --nodeclaw-border: rgba(96, 165, 250, 0.34);
        --nodeclaw-border-neutral: rgba(148, 163, 184, 0.18);
        box-sizing: border-box;
        margin: 1.25rem 0 1.5rem;
      }
      .nodeclaw-status-events[hidden] {
        display: none;
      }
      .nodeclaw-status-events * {
        box-sizing: border-box;
      }
      .nodeclaw-status-events__board {
        border: 1px solid var(--nodeclaw-border);
        border-radius: 22px;
        background:
          radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 20rem),
          radial-gradient(circle at bottom right, rgba(110, 231, 183, 0.10), transparent 18rem),
          linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.76));
        box-shadow: 0 24px 64px rgba(2, 6, 23, 0.36);
        padding: 1rem;
      }
      .nodeclaw-status-events__board-head {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 0.9rem;
      }
      .nodeclaw-status-events__heading {
        margin: 0;
        color: var(--nodeclaw-text);
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .nodeclaw-status-events__heading::before {
        background: var(--nodeclaw-accent);
        border-radius: 999px;
        content: '';
        display: inline-block;
        height: 0.72rem;
        margin-right: 0.45rem;
        width: 0.22rem;
      }
      .nodeclaw-status-events__description {
        color: var(--nodeclaw-muted);
        line-height: 1.5;
        margin: 0;
      }
      .nodeclaw-status-events__toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: space-between;
        margin-bottom: 0.9rem;
      }
      .nodeclaw-status-events__tabs {
        align-items: center;
        background: rgba(2, 6, 23, 0.34);
        border: 1px solid rgba(147, 197, 253, 0.16);
        border-radius: 999px;
        display: flex;
        flex-wrap: wrap;
        gap: 0.18rem;
        padding: 0.2rem;
      }
      .nodeclaw-status-events__tab {
        background: transparent !important;
        border: 0 !important;
        border-radius: 999px;
        color: var(--nodeclaw-muted) !important;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 750;
        padding: 0.34rem 0.68rem;
        transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }
      .nodeclaw-status-events__tab:hover {
        background: rgba(147, 197, 253, 0.10) !important;
        color: #e0f2fe !important;
      }
      .nodeclaw-status-events__tab:disabled {
        color: rgba(148, 163, 184, 0.52) !important;
        cursor: not-allowed;
      }
      .nodeclaw-status-events__tab:disabled:hover {
        background: transparent !important;
        color: rgba(148, 163, 184, 0.52) !important;
      }
      .nodeclaw-status-events__tab[aria-pressed='true'] {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.86), rgba(96, 165, 250, 0.58)) !important;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
        color: #ffffff !important;
        transform: translateY(-1px);
      }
      .nodeclaw-status-events__count {
        color: var(--nodeclaw-subtle);
        font-size: 0.84rem;
        font-weight: 650;
      }
      .nodeclaw-status-events__list {
        display: grid;
        gap: 0.75rem;
      }
      .nodeclaw-status-events__item {
        border: 1px solid var(--nodeclaw-border-neutral);
        border-radius: 16px;
        background:
          linear-gradient(135deg, rgba(2, 6, 23, 0.50), rgba(15, 23, 42, 0.58));
        padding: 0.9rem;
      }
      .nodeclaw-status-events__topline {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        justify-content: space-between;
        margin-bottom: 0.35rem;
      }
      .nodeclaw-status-events__title {
        color: var(--nodeclaw-text);
        font-weight: 750;
        letter-spacing: -0.01em;
      }
      .nodeclaw-status-events__badges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .nodeclaw-status-events__badge {
        border: 1px solid rgba(96, 165, 250, 0.26);
        border-radius: 999px;
        background: var(--nodeclaw-accent-soft);
        color: #bfdbfe;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.04em;
        padding: 0.18rem 0.55rem;
        text-transform: uppercase;
      }
      .nodeclaw-status-events__badge--minor {
        border-color: rgba(252, 211, 77, 0.32);
        background: rgba(120, 53, 15, 0.44);
        color: #fef3c7;
      }
      .nodeclaw-status-events__badge--major,
      .nodeclaw-status-events__badge--critical {
        border-color: rgba(252, 165, 165, 0.34);
        background: rgba(127, 29, 29, 0.42);
        color: #fee2e2;
      }
      .nodeclaw-status-events__summary {
        color: var(--nodeclaw-muted);
        line-height: 1.58;
        margin: 0.25rem 0 0;
      }
      .nodeclaw-status-events__meta {
        align-items: center;
        color: var(--nodeclaw-subtle);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.84rem;
        gap: 0.5rem;
        margin-top: 0.6rem;
      }
      .nodeclaw-status-events__link {
        color: var(--nodeclaw-accent-strong);
        font-weight: 750;
        text-decoration: none;
      }
      .nodeclaw-status-events__link:hover {
        text-decoration: underline;
      }
      .nodeclaw-status-events__link:focus-visible {
        border-radius: 6px;
        outline: 3px solid rgba(147, 197, 253, 0.40);
        outline-offset: 3px;
      }
      .nodeclaw-status-events__pager {
        align-items: center;
        color: var(--nodeclaw-subtle);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.86rem;
        gap: 0.6rem;
        justify-content: flex-end;
        margin-top: 0.9rem;
      }
      .nodeclaw-status-events__pager[hidden] {
        display: none;
      }
      .nodeclaw-status-events__pager-button {
        background: rgba(15, 23, 42, 0.62) !important;
        border: 1px solid rgba(147, 197, 253, 0.18) !important;
        border-radius: 999px;
        color: var(--nodeclaw-accent-strong) !important;
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 750;
        padding: 0.34rem 0.72rem;
      }
      .nodeclaw-status-events__pager-button:not(:disabled):hover {
        background: rgba(37, 99, 235, 0.22) !important;
        border-color: rgba(147, 197, 253, 0.36) !important;
      }
      .nodeclaw-status-events__pager-button:disabled {
        color: rgba(148, 163, 184, 0.48) !important;
        cursor: not-allowed;
      }
      @media (min-width: 768px) {
        main.container > header,
        header.svelte-ngkazm {
          padding: 1.75rem !important;
        }
        .nodeclaw-status-events__board {
          padding: 1.15rem 1.25rem;
        }
      }
    </style>
  customBodyHtml: |
    <section id="nodeclaw-status-events" class="nodeclaw-status-events" aria-label="NodeClaw status events" hidden></section>
    <script>
      (function () {
        var PAGE_SIZE = 5;
        var sectionConfig = [
          { type: 'announcement', title: 'Announcements' },
          { type: 'notice', title: 'Notices' },
          { type: 'maintenance', title: 'Maintenance' },
          { type: 'operational-report', title: 'Reports' },
          { type: 'incident', title: 'Manual Incidents' }
        ];

        function onReady(callback) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', callback);
          } else {
            callback();
          }
        }

        function textNode(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }

        function statusBaseUrl() {
          var base = document.querySelector('base');
          var href = base && base.getAttribute('href') ? base.getAttribute('href') : '/Nodeclaw-Status/';
          return href.endsWith('/') ? href : href + '/';
        }

        function formatDate(value) {
          if (!value) return '';
          var date = new Date(value);
          if (Number.isNaN(date.getTime())) return '';
          return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(date);
        }

        function renderBadge(text, modifier) {
          return textNode('span', 'nodeclaw-status-events__badge' + (modifier ? ' nodeclaw-status-events__badge--' + modifier : ''), text);
        }

        function renderEvent(event) {
          var item = textNode('article', 'nodeclaw-status-events__item');
          var topline = textNode('div', 'nodeclaw-status-events__topline');
          var title = textNode('div', 'nodeclaw-status-events__title', event.title || 'Status event');
          var badges = textNode('div', 'nodeclaw-status-events__badges');

          badges.appendChild(renderBadge(event.state || 'active'));
          badges.appendChild(renderBadge(event.severity || 'info', event.severity || 'info'));
          if (event.pinned) badges.appendChild(renderBadge('pinned'));

          topline.appendChild(title);
          topline.appendChild(badges);
          item.appendChild(topline);
          item.appendChild(textNode('p', 'nodeclaw-status-events__summary', event.summary || 'No public summary provided.'));

          var meta = textNode('div', 'nodeclaw-status-events__meta');
          var startsAt = formatDate(event.startsAt || event.scheduledFor || event.publishedAt);
          if (startsAt) meta.appendChild(textNode('span', '', startsAt));
          if (Array.isArray(event.components) && event.components.length) {
            meta.appendChild(textNode('span', '', event.components.join(', ')));
          }
          if (event.sourceIssue) {
            var link = textNode('a', 'nodeclaw-status-events__link', 'Issue #' + (event.issueNumber || event.id));
            link.href = event.sourceIssue;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            meta.appendChild(link);
          }
          item.appendChild(meta);
          return item;
        }

        function sectionTitle(type) {
          var match = sectionConfig.find(function (section) { return section.type === type; });
          return match ? match.title : 'Status Updates';
        }

        function eventTimestamp(event) {
          var value = event.startsAt || event.scheduledFor || event.publishedAt || event.updatedAt;
          var date = value ? new Date(value) : null;
          return date && !Number.isNaN(date.getTime()) ? date.getTime() : 0;
        }

        function sortEvents(events) {
          return events.slice().sort(function (left, right) {
            if (Boolean(left.pinned) !== Boolean(right.pinned)) return left.pinned ? -1 : 1;
            return eventTimestamp(right) - eventTimestamp(left);
          });
        }

        function render(root, data) {
          var events = Array.isArray(data && data.events) ? data.events : [];
          var visibleEvents = sortEvents(events.filter(function (event) {
            return event && ['scheduled', 'active', 'resolved'].indexOf(event.state) !== -1;
          }));
          if (!visibleEvents.length) return;

          var selectedType = 'all';
          var currentPage = 1;
          var board = textNode('section', 'nodeclaw-status-events__board');
          var head = textNode('div', 'nodeclaw-status-events__board-head');
          var toolbar = textNode('div', 'nodeclaw-status-events__toolbar');
          var tabs = textNode('div', 'nodeclaw-status-events__tabs');
          var count = textNode('div', 'nodeclaw-status-events__count');
          var list = textNode('div', 'nodeclaw-status-events__list');
          var pager = textNode('div', 'nodeclaw-status-events__pager');
          var previous = textNode('button', 'nodeclaw-status-events__pager-button', 'Previous');
          var pageLabel = textNode('span', 'nodeclaw-status-events__page-label');
          var next = textNode('button', 'nodeclaw-status-events__pager-button', 'Next');
          var tabButtons = [];
          var typeCounts = visibleEvents.reduce(function (accumulator, event) {
            accumulator[event.type] = (accumulator[event.type] || 0) + 1;
            return accumulator;
          }, {});
          var tabConfig = [{ type: 'all', title: 'All' }].concat(sectionConfig);

          head.appendChild(textNode('h2', 'nodeclaw-status-events__heading', 'Status Updates'));
          head.appendChild(textNode('p', 'nodeclaw-status-events__description', 'Public announcements, notices, maintenance, reports, and manual incident updates.'));

          tabConfig.forEach(function (section) {
            var total = section.type === 'all' ? visibleEvents.length : (typeCounts[section.type] || 0);
            var button = textNode('button', 'nodeclaw-status-events__tab', section.title + ' ' + total);
            button.type = 'button';
            button.disabled = section.type !== 'all' && total === 0;
            button.setAttribute('aria-pressed', section.type === selectedType ? 'true' : 'false');
            button.addEventListener('click', function () {
              if (button.disabled) return;
              selectedType = section.type;
              currentPage = 1;
              updateBoard();
            });
            tabs.appendChild(button);
            tabButtons.push({ type: section.type, button: button });
          });

          previous.type = 'button';
          next.type = 'button';
          previous.addEventListener('click', function () {
            if (currentPage > 1) {
              currentPage -= 1;
              updateBoard();
            }
          });
          next.addEventListener('click', function () {
            currentPage += 1;
            updateBoard();
          });
          pager.appendChild(previous);
          pager.appendChild(pageLabel);
          pager.appendChild(next);
          toolbar.appendChild(tabs);
          toolbar.appendChild(count);
          board.appendChild(head);
          board.appendChild(toolbar);
          board.appendChild(list);
          board.appendChild(pager);

          function currentItems() {
            if (selectedType === 'all') return visibleEvents;
            return visibleEvents.filter(function (event) { return event.type === selectedType; });
          }

          function updateBoard() {
            var items = currentItems();
            var pageCount = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
            currentPage = Math.min(Math.max(currentPage, 1), pageCount);
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageItems = items.slice(start, start + PAGE_SIZE);
            list.replaceChildren();
            pageItems.forEach(function (event) { list.appendChild(renderEvent(event)); });
            tabButtons.forEach(function (entry) {
              entry.button.setAttribute('aria-pressed', entry.type === selectedType ? 'true' : 'false');
            });
            count.textContent = 'Showing ' + (start + 1) + '-' + (start + pageItems.length) + ' of ' + items.length + ' ' + sectionTitle(selectedType).toLowerCase();
            pageLabel.textContent = 'Page ' + currentPage + ' / ' + pageCount;
            previous.disabled = currentPage <= 1;
            next.disabled = currentPage >= pageCount;
            pager.hidden = pageCount <= 1;
          }

          updateBoard();
          root.replaceChildren(board);
          root.hidden = false;

          var header = document.querySelector('main > header');
          if (header && root.parentElement !== header.parentElement) {
            header.insertAdjacentElement('afterend', root);
          }
        }

        onReady(function () {
          var root = document.getElementById('nodeclaw-status-events');
          if (!root) return;
          fetch(statusBaseUrl() + 'api/status-events.json', { cache: 'no-store' })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (data) { if (data) render(root, data); })
            .catch(function () { root.hidden = true; });
        });
      }());
    </script>
